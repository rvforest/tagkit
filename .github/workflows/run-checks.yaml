name: Run Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  FORCE_COLOR: 1

permissions:
  contents: read

jobs:
  run-checks:
    name: Run checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        run: uv python install

      - name: Run checks
        run: uv run pre-commit run --all-files --hook-stage push --show-diff-on-failure

  run-tests:
    name: Run tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Codecov OIDC uploads
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: wntrblm/nox@2026.10.20

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        run: uv python install

      - name: Run tests
        run: >
          nox -s "coverage-${{ matrix.python-version }}" \
            -- \
            --cov-report=xml \
            -vv \
            --junitxml=junit.xml \
            -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          report_type: test_results

  run-doctests:
    name: Run doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: wntrblm/nox@2026.10.20

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run doctest
        run: nox -s doctest -- -vv

  build-and-cli-check:
    name: Build, install, and CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build sdist and wheel
        run: uv build

      - name: Install built wheel
        run: |
          pip install dist/*.whl

      - name: CLI smoke test
        run: |
          tagkit --help
          tagkit --version
