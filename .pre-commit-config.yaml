# Install both hook types with `pre-commit install`. The diff-coverage hook
# is pre-push only so it does not run on every commit.
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false # ruff is fast enough to check everything
      - id: format
        name: format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: types
        name: check types
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false  # mypy is a whole-program checker; "." is the project root
        require_serial: true  # avoid SQLite cache races between hook processes
      - id: zizmor
        name: check GitHub Actions security
        entry: uv run zizmor --offline --format=github .
        language: system
        files: ^\.github/
        pass_filenames: false
      - id: diff-coverage
        name: diff coverage
        entry: uv run nox -s diff-coverage
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.1
    hooks:
      - id: cspell # Spell check changed files
        name: check docs spelling
        files: \.(md)$
        language_version: 26.13.1  # Active LTS; hook needs Node >=22.18.0

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.8
    hooks:
      - id: uv-lock

default_stages: [pre-commit, pre-push]
